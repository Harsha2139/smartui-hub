<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQuiz | Interactive Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">🧠 SmartQuiz</div>

    <button id="themeBtn" class="theme-btn">🌙</button>
</header>

<main class="container">

    <!-- Start Screen -->
    <section id="startScreen" class="card start-screen">
        <div class="icon">🎯</div>
        <h1>Interactive Quiz</h1>
        <p>Test your knowledge with this quick programming quiz.</p>

        <div class="quiz-info">
            <div>
                <strong>10</strong>
                <span>Questions</span>
            </div>

            <div>
                <strong>60</strong>
                <span>Seconds</span>
            </div>

            <div>
                <strong>10</strong>
                <span>Points</span>
            </div>
        </div>

        <button id="startBtn" class="primary-btn">
            Start Quiz
        </button>
    </section>


    <!-- Quiz Screen -->
    <section id="quizScreen" class="quiz-screen hidden">

        <div class="quiz-top">
            <span id="questionNumber">Question 1 of 10</span>

            <div class="timer">
                ⏱️ <span id="timer">60</span>s
            </div>
        </div>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="card question-card">

            <h2 id="question">
                Question goes here
            </h2>

            <div id="options" class="options"></div>

            <div class="navigation">
                <button id="prevBtn" class="secondary-btn">
                    ← Previous
                </button>

                <button id="nextBtn" class="primary-btn">
                    Next →
                </button>
            </div>

        </div>

    </section>


    <!-- Result Screen -->
    <section id="resultScreen" class="card result-screen hidden">

        <div class="result-icon">🏆</div>

        <h1>Quiz Completed!</h1>

        <p>Your final score is</p>

        <div class="score">
            <span id="score">0</span>
            / 10
        </div>

        <p id="resultMessage"></p>

        <button id="restartBtn" class="primary-btn">
            Restart Quiz
        </button>

    </section>

</main>

<footer>
    <p>SmartUI Hub • Interactive Quiz Template</p>
</footer>

<script src="script.js"></script>

</body>
</html>
