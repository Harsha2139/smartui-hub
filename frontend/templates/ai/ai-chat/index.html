<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat Interface | SmartUI Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    <span>AI</span>
                    Chat
                </div>

                <button
                    id="newChatButton"
                    class="new-chat-button"
                    type="button">
                    + New Chat
                </button>

            </div>

            <div class="chat-history">

                <p class="history-title">
                    Recent Chats
                </p>

                <button class="history-item active" type="button">
                    Explain recursion
                </button>

                <button class="history-item" type="button">
                    Create a study plan
                </button>

                <button class="history-item" type="button">
                    JavaScript project ideas
                </button>

                <button class="history-item" type="button">
                    Machine learning basics
                </button>

            </div>

            <div class="sidebar-bottom">

                <button id="themeButton" type="button">
                    🌙 Dark Mode
                </button>

                <button id="clearChatButton" type="button">
                    🗑️ Clear Chat
                </button>

            </div>

        </aside>


        <!-- MAIN CHAT -->
        <main class="chat-main">

            <!-- HEADER -->
            <header class="chat-header">

                <div class="assistant-info">

                    <div class="assistant-avatar">
                        🤖
                    </div>

                    <div>

                        <h1>
                            AI Assistant
                        </h1>

                        <p>
                            <span class="online-dot"></span>
                            Online
                        </p>

                    </div>

                </div>

                <div class="header-actions">

                    <button
                        id="mobileMenuButton"
                        class="header-button"
                        type="button">
                        ☰
                    </button>

                    <button
                        id="clearHeaderButton"
                        class="header-button"
                        type="button">
                        🗑️
                    </button>

                </div>

            </header>


            <!-- CHAT MESSAGES -->
            <section
                id="chatMessages"
                class="chat-messages">

                <div class="message ai-message">

                    <div class="message-avatar">
                        🤖
                    </div>

                    <div class="message-content">

                        <div class="message-name">
                            AI Assistant
                        </div>

                        <div class="message-bubble">

                            <p>
                                Hello! 👋 I'm your AI Assistant.
                            </p>

                            <p>
                                How can I help you today?
                            </p>

                        </div>

                    </div>

                </div>

            </section>


            <!-- TYPING INDICATOR -->
            <div
                id="typingIndicator"
                class="typing-indicator hidden">

                <span></span>
                <span></span>
                <span></span>

                <p>
                    AI is thinking...
                </p>

            </div>


            <!-- INPUT AREA -->
            <footer class="chat-input-area">

                <div class="suggestions">

                    <button
                        type="button"
                        class="suggestion-button"
                        data-prompt="Explain this topic in simple terms">

                        Explain this topic

                    </button>

                    <button
                        type="button"
                        class="suggestion-button"
                        data-prompt="Give me a simple example">

                        Give me an example

                    </button>

                    <button
                        type="button"
                        class="suggestion-button"
                        data-prompt="Create a study plan for me">

                        Create a study plan

                    </button>

                </div>


                <div class="chat-input-container">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message AI Assistant..."
                        aria-label="Message AI Assistant"></textarea>

                    <button
                        id="sendButton"
                        class="send-button"
                        type="button">

                        ➤

                    </button>

                </div>


                <p class="input-note">
                    AI can make mistakes. Check important information.
                </p>

            </footer>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
